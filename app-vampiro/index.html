<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Perfil Vampiro</title>
    </head>

    <body>
        <h1>Perfil Vampiro</h1>
        <p id="nome-vamp"></p>
        <p id="cla-vamp"></p>
        <p id="status-vamp"></p>
        <img src="" alt="" id="foto-vamp">

        <script>
            const vampireId = 1;
            fetch('http://localhost:8080/api/v1/vampiros/'+vampireId)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("foto-vamp").src = data.foto_perfil
                    document.getElementById("nome-vamp").innerText = "Nome: "+data.nome
                    document.getElementById("status-vamp").innerText = "Status: "+data.status
                    document.getElementById("cla-vamp").innerText = "Clã: "+data.cla
                })
        </script>

    </body>

</html>
