info:
  name: Filtrar tipo por query param
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8081/api/v1/mangas?tipo=gibi
  params:
    - name: tipo
      value: gibi
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
